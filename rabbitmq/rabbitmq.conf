# RabbitMQ 4.1.0 Configuration
# Allow guest user connection from remote or container hosts
loopback_users.guest = false

# Standard TCP listener for AMQP 0-9-1 and 1.0
listeners.tcp.default = 5672

# Management plugin HTTP listener
management.tcp.port = 15672

# Memory high watermark (e.g. 0.4 of available RAM)
vm_memory_high_watermark.relative = 0.6

# Disk free limit
disk_free_limit.relative = 1.0
